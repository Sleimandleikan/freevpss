name: CI

on: [push, workflow_dispatcher]

jobs:
  build:

  runs-on: windows-latest

steps:
- name: Download
  run: Invoke-WebRequest https://bin.equinox.io/c/bJyj1nQVR4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
- name: Extract
  run: Expand-Archive ngrok.zip
- name: Auth
  run: .\ngrok\ngrok.exe authtoken $Env:NGROK_AUTH_TOKEN
env:
  NGROK_AUTH_TOKEN: $(secrets.NGROK_AUTH_TOKEN))
- name: Enable TS
  run: Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\" -name "DenyTSConnections" -Value 0
- run: Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
- run: Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -name "UserAuthentication" -value 1
- run: Set-LocalUser -Name "Tunnereadmin" -Password (ConvertTo-SecureString -AsPlainText "Passwdrd") -Force
- name: Create Tunnel
  run: .\ngrok\ngrok.exe tcp 3389
